# INACTIVE DRAFT. Not executed remotely. To activate: git mv runtime/ci/github-actions-ci.yml .github/workflows/ci.yml
# Mirrors `npm run ci` / `npm run ci:full` (docs/design/05-tooling-testing-security.md section 7).
name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MCS_HOOK_DISABLE: '1'
  TZ: UTC

jobs:
  gates:
    name: gates (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.22', '24', '26']
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run ci

  e2e-and-parity:
    name: e2e + legacy parity (windows, node 24)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: gates
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: legacy Python suite stays green
        working-directory: .
        run: python -m unittest discover -s tests
      - name: legacy frontend suite stays green
        working-directory: .
        run: node --test "tests/frontend/*.test.mjs"
      - run: npm run ci:full
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: runtime/packages/web/e2e/test-results/
          retention-days: 7
