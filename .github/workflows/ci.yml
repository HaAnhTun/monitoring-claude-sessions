# Active workflow (ADR 0065, amends ADR 0048). Mirrors `npm run ci` (runtime/scripts/ci.mjs).
# No pull_request trigger: private-repository minutes are multiplied (Windows x2, macOS x10). The `report` job (display name
# ci-status) is the only job that may write: it commits a JSON summary to the orphan branch `ci-status` with the workflow token.
# The lead reads it without gh: `git fetch origin ci-status` then `node runtime/scripts/ci-status.mjs read --sha HEAD`.
# Full matrix additions (Windows arm64, macOS x64, Linux arm64) wait until the repository is public:
#   - os: windows-11-arm
#   - os: macos-13
#   - os: ubuntu-24.04-arm
name: ci

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      full:
        description: Also run Windows on Node 22.22 and 26 and the end-to-end suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MCS_HOOK_DISABLE: "1"
  TZ: UTC

jobs:
  gates:
    name: gates (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: "24"
          - os: ubuntu-latest
            node: "22.22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run ci -- --bundle --summary-json ci-summary.json
      - run: npm run test:slow
      - if: always()
        env:
          MCS_CI_JOB: gates
          MCS_CI_OS: ${{ runner.os }}
          MCS_CI_ARCH: ${{ runner.arch }}
          MCS_CI_NODE: ${{ matrix.node }}
          MCS_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-status.mjs summarize --in ci-summary.json --out ci-job.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-job-gates-${{ matrix.os }}-${{ matrix.node }}
          path: runtime/ci-job.json
          if-no-files-found: ignore
          retention-days: 3

  gates-full:
    name: gates-full (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: ["22.22", "26"]
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run ci -- --bundle --summary-json ci-summary.json
      - run: npm run test:slow
      - if: always()
        env:
          MCS_CI_JOB: gates-full
          MCS_CI_OS: ${{ runner.os }}
          MCS_CI_ARCH: ${{ runner.arch }}
          MCS_CI_NODE: ${{ matrix.node }}
          MCS_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-status.mjs summarize --in ci-summary.json --out ci-job.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-job-gates-full-${{ matrix.os }}-${{ matrix.node }}
          path: runtime/ci-job.json
          if-no-files-found: ignore
          retention-days: 3

  macos:
    name: macos (arm64, node 24, lean)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --project unit packages/engine/src/platform
      - run: node scripts/smoke.mjs --bundle
      - if: always()
        env:
          MCS_CI_JOB: macos
          MCS_CI_OS: ${{ runner.os }}
          MCS_CI_ARCH: ${{ runner.arch }}
          MCS_CI_NODE: "24"
          MCS_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-status.mjs summarize --out ci-job.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-job-macos
          path: runtime/ci-job.json
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.os }}, node 24)
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: always()
        env:
          MCS_CI_JOB: e2e
          MCS_CI_OS: ${{ runner.os }}
          MCS_CI_ARCH: ${{ runner.arch }}
          MCS_CI_NODE: "24"
          MCS_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-status.mjs summarize --out ci-job.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-job-e2e-${{ matrix.os }}
          path: runtime/ci-job.json
          if-no-files-found: ignore
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.os }}
          path: runtime/packages/web/e2e/test-results/
          retention-days: 7

  report:
    name: ci-status
    needs: [gates, gates-full, macos, e2e]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-job-*
          path: ci-jobs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-status.mjs publish --dir ../ci-jobs
